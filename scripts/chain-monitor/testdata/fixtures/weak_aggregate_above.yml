name: weak_aggregate_above_threshold
description: strong aggregate does not alert
validator_power: 1000
block:
  height: 101
  time: "2026-08-05T12:00:01Z"
  events:
    - type: aggregate_report
      source: finalize_block
      attrs:
        aggregate_power: "800"
        query_id: abc123
rules:
  - id: weak_aggregate
    channel: oracle
    match:
      event_type: aggregate_report
    when:
      attr_uint_lt_ratio:
        attr: aggregate_power
        ratio: 0.666
        against: validator_power
    embed:
      title: Weak Aggregate
      fields:
        - { attr: aggregate_power, name: Power }
expect:
  alert_count: 0
  alerts: []
