syntax = "proto3";

package layer.oracle;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "layer/oracle/params.proto";

option go_package = "github.com/tellor-io/layer/x/oracle/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;
  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  rpc SubmitValue(MsgSubmitValue) returns (MsgSubmitValueResponse);
  rpc Tip(MsgTip) returns (MsgTipResponse);
  rpc UpdateCyclelist(MsgUpdateCyclelist) returns (MsgUpdateCyclelistResponse);
  rpc UpdateQueryDataLimit(MsgUpdateQueryDataLimit) returns (MsgUpdateQueryDataLimitResponse);
  rpc BatchSubmitValue(MsgBatchSubmitValue) returns (MsgBatchSubmitValueResponse);
  rpc UpdateMaxBatchSize(MsgUpdateMaxBatchSize) returns (MsgUpdateMaxBatchSizeResponse);
  rpc CrossChainTip(MsgCrossChainTip) returns (MsgCrossChainTipResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "layer/x/oracle/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
message MsgUpdateParamsResponse {}
message MsgSubmitValue {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes query_data = 2;
  string value = 3;
}

message MsgSubmitValueResponse {
  uint64 id = 1;
}

message MsgTip {
  option (cosmos.msg.v1.signer) = "tipper";
  string tipper = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes query_data = 2;
  cosmos.base.v1beta1.Coin amount = 3 [(gogoproto.nullable) = false];
}

message MsgTipResponse {}

// MsgCrossChainTip fronts a tip on Layer on behalf of an Ethereum escrow tip,
// recording the funder's Ethereum payout address for later settlement.
message MsgCrossChainTip {
  option (cosmos.msg.v1.signer) = "tipper";
  string tipper = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes query_data = 2;
  cosmos.base.v1beta1.Coin amount = 3 [(gogoproto.nullable) = false];
  // total escrow amount in loya (gross); first funder's value is stored as the
  // funding cap, later funders must match it exactly
  // should be confirmed by later funders before adding additional funds
  string escrow_total = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // EVM chain id hosting the escrow contract
  uint64 escrow_chain_id = 5;
  // 20-byte escrow contract address
  bytes escrow_contract = 6;
  // escrow id (nonce) inside the escrow contract
  uint64 escrow_id = 7;
  // 20-byte Ethereum address to be repaid from the escrow
  bytes eth_payout_address = 8;
}

message MsgCrossChainTipResponse {
  // hex settlement query id (= escrow key on Layer)
  string settlement_query_id = 1;
}

// MsgUpdateCycleRequest is the Msg/UpdateCycle request type.
message MsgUpdateCyclelist {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "layer/x/oracle/MsgUpdateCyclelist";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // list of query data hex strings
  repeated bytes cyclelist = 2;
}

// MsgUpdateCycleResponse defines the Msg/UpdateCycle response type.
message MsgUpdateCyclelistResponse {}

message MsgUpdateQueryDataLimit {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 limit = 2;
}

message MsgUpdateQueryDataLimitResponse {}

message MsgBatchSubmitValue {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated SubmitValueItem values = 2;
}

message MsgBatchSubmitValueResponse {
  repeated uint32 failed_indices = 1;
}

message SubmitValueItem {
  bytes query_data = 1;
  string value = 2;
}

message MsgUpdateMaxBatchSize {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "layer/x/oracle/MsgUpdateMaxBatchSize";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint32 max_batch_size = 2;
}
message MsgUpdateMaxBatchSizeResponse {}