name: End to End Tests

on:
  pull_request:
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

# Fork PRs run via the unprivileged `pull_request` trigger: read-only token, no
# secrets, approval gate for outside contributors. Keep it that way — never use
# pull_request_target here.
permissions:
  contents: read

env:
  TAR_PATH: heighliner.tar
  IBC_TAR_PATH: heighliner-ibc.tar

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # local: "true" builds the checked-out merge commit (fork-safe; no re-clone by branch).
      - name: Build Primary Docker Image
        uses: strangelove-ventures/heighliner-build-action@7f75f09bb485ad90b0ed00f2bd40dfb196d212af # v1.0.3
        with:
          local: "true"
          registry: ""
          tag: local
          tar-export-path: ${{ env.TAR_PATH }}
          platform: linux/amd64
          chain: layer
          dockerfile: cosmos
          build-target: make install
          binaries: |
            - /go/bin/layerd
          heighliner-tag: v1.7.5
          additional-args: |
            --go-version 1.24.13 --alpine-version 3.22

      - name: Publish Primary Tarball as Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layer-docker-image
          path: ${{ env.TAR_PATH }}
          retention-days: 3

  # Independent of build-primary so both images build in parallel.
  build-ibc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout IBC Branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ibc

      - name: Build IBC Docker Image
        uses: strangelove-ventures/heighliner-build-action@7f75f09bb485ad90b0ed00f2bd40dfb196d212af # v1.0.3
        with:
          local: "true"
          registry: ""
          tag: local
          tar-export-path: ${{ env.IBC_TAR_PATH }}
          platform: linux/amd64
          chain: layer-icq
          dockerfile: cosmos
          build-target: make install
          binaries: |
            - /go/bin/layerd
          heighliner-tag: v1.7.5
          additional-args: |
            --go-version 1.24.13 --alpine-version 3.22

      - name: Publish IBC Tarball as Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: layer-icq-docker-image
          path: ${{ env.IBC_TAR_PATH }}
          retention-days: 3

  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24'
          cache-dependency-path: e2e/go.sum

      - name: Generate Matrix
        id: set-matrix
        run: |
          set -euo pipefail
          OUT="$(mktemp)"
          (
            cd e2e
            # -list also prints package status lines (ok/FAIL). We only want test names.
            go test -list '^Test' . | tee "${OUT}" >/dev/null
          )
          TESTS="$(grep '^Test' "${OUT}" | grep -vx 'TestIbcInterchainQuery' | jq -R -s -c 'split("\n")[:-1]')"
          echo "matrix=${TESTS}" >> "${GITHUB_OUTPUT}"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - prepare
      - build-primary
    strategy:
      matrix:
        test: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24'
          cache-dependency-path: e2e/go.sum

      - name: Download Primary Tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: layer-docker-image

      - name: Load Primary Docker Image
        run: docker image load -i ${{ env.TAR_PATH }}

      - name: Run Tests
        env:
          E2E_TEST: ${{ matrix.test }}
        run: cd e2e && go test -race -v -timeout 15m -run "^${E2E_TEST}$" .

  test-ibc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - build-primary
      - build-ibc
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24'
          cache-dependency-path: e2e/go.sum

      - name: Download Primary Tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: layer-docker-image

      - name: Load Primary Docker Image
        run: docker image load -i ${{ env.TAR_PATH }}

      - name: Download IBC Tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: layer-icq-docker-image

      - name: Load IBC Docker Image
        run: docker image load -i ${{ env.IBC_TAR_PATH }}

      - name: Run IBC Test
        run: cd e2e && go test -race -v -timeout 15m -run "^TestIbcInterchainQuery$" .
